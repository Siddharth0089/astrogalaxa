services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    ports: ["3000:3000"]
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
  redis_data:
